
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Huaraz Explorer | Guía Turística Digital</title>
    <meta name="description" content="La guía más completa de Huaraz. Encuentra hoteles, restaurantes, tours, cupones de descuento y un asistente IA para tu viaje a la Cordillera Blanca." />
    
    <link rel="manifest" href="/manifest.json?v=4" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2A4D69" />
    <link rel="icon" href="https://i.imgur.com/Cax54U1.png?v=4" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        // SHIM GLOBAL ROBUSTO
        // Previene que process.env sea undefined y permite que el bundler inyecte la llave
        window.process = window.process || { env: {} };
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "brand-green": "#13ec5b",
                        "brand-orange": "#F58220",
                        "brand-blue": "#00a8e8",
                        "brand-dark-blue": "#2A4D69",
                        "brand-accent": "#ffc107",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        #root { min-height: 100vh; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
        "qrcode": "https://aistudiocdn.com/qrcode@^1.5.3"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#f6f8f6] dark:bg-[#102216] text-[#111813] dark:text-[#f6f8f6]">

</body>
</html>
