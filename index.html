
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO Básico -->
    <title>Huaraz Explorer | Guía Turística Digital</title>
    <meta name="description" content="La guía más completa de Huaraz. Encuentra hoteles, restaurantes, tours, cupones de descuento y un asistente IA para tu viaje a la Cordillera Blanca." />
    <meta name="keywords" content="Huaraz, Turismo, Ancash, Cordillera Blanca, Laguna 69, Pastoruri, Restaurantes Huaraz, Hoteles Huaraz" />
    <meta name="author" content="Huaraz Explorer" />

    <!-- Manifest para PWA y Google Icons -->
    <link rel="manifest" href="/manifest.json?v=4" />
    
    <!-- Compatibilidad PWA Moderna -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Huaraz Explorer">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://huarazexplorer.com/" />
    <meta property="og:title" content="Huaraz Explorer | Guía de Huaraz" />
    <meta property="og:description" content="Planifica tu viaje a Huaraz con nuestra App interactiva. Cupones, Mapas y Asistente IA." />
    <meta property="og:image" content="https://i.imgur.com/Cax54U1.png?v=4" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Huaraz Explorer" />
    <meta property="twitter:description" content="Todo lo que necesitas para tu aventura en los Andes peruanos." />
    <meta property="twitter:image" content="https://i.imgur.com/Cax54U1.png?v=4" />
    
    <!-- Metadatos de Identidad Visual -->
    <link rel="icon" href="https://i.imgur.com/Cax54U1.png?v=4" sizes="any" type="image/png" />
    <link rel="apple-touch-icon" href="https://i.imgur.com/Cax54U1.png?v=4" />
    
    <meta name="theme-color" content="#2A4D69" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        // Parche de compatibilidad inteligente: No sobrescribe si ya existe
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        
        // Si no hay API_KEY definida, aseguramos que al menos el objeto exista para evitar ReferenceError
        if (typeof window.process.env.API_KEY === 'undefined') {
            window.process.env.API_KEY = "";
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "brand-green": "#13ec5b",
                        "brand-orange": "#F58220",
                        "brand-blue": "#00a8e8",
                        "brand-dark-blue": "#2A4D69",
                        "brand-accent": "#ffc107",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "text-light": "#111813",
                        "text-dark": "#f6f8f6",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .prose img { border-radius: 1rem; }
        #root { min-height: 100vh; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
        "qrcode": "https://aistudiocdn.com/qrcode@^1.5.3"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">

</body>
</html>
